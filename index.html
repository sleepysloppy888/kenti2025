<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>КЕНТИ-2025</title>
    <!-- Основной скрипт -->
    <script src="https://cdn.jsdelivr.net"></script>
    <style>
        :root { --bg: #0a0a0a; --text: #ffffff; --accent: #3b82f6; --gray: #1f2937; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .hidden { display: none !important; }
        section { width: 100%; max-width: 500px; padding: 20px; box-sizing: border-box; text-align: center; }
        #home { flex: 1; display: flex; flex-direction: column; justify-content: center; }
        h1 { font-size: 3rem; letter-spacing: 5px; margin-bottom: 30px; }
        button { background: var(--accent); color: white; border: none; padding: 15px; cursor: pointer; border-radius: 8px; width: 100%; font-weight: bold; transition: 0.2s; }
        button:hover { opacity: 0.8; }
        button:disabled { background: #444; cursor: not-allowed; }
        input { width: 100%; padding: 12px; margin: 10px 0; background: #000; border: 1px solid #333; color: white; border-radius: 6px; box-sizing: border-box; }
        .nomination { background: var(--gray); padding: 15px; border-radius: 12px; margin-bottom: 20px; text-align: left; }
        .nominee-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #333; }
        .vote-btn { width: auto; padding: 5px 10px; font-size: 0.8rem; }
        .winner-tag { color: #10b981; font-size: 0.8rem; display: block; margin-bottom: 10px; font-weight: bold; }
        .error-card { color: #ff4b4b; background: rgba(255,0,0,0.1); padding: 15px; border-radius: 10px; border: 1px solid red; margin-top: 10px; font-size: 0.9rem; }
    </style>
</head>
<body>

    <section id="home">
        <h1>КЕНТИ-2025</h1>
        <button id="main-btn" onclick="initApp()">ПЕРЕЙТИ К ГОЛОСОВАНИЮ</button>
        <div id="lib-error" class="hidden error-card">
            <b>Библиотека заблокирована!</b><br>
            Твой браузер или расширение (AdBlock) не дает загрузить базу данных.<br>
            <button onclick="location.reload()" style="background:#444; margin-top:10px; padding:5px;">Попробовать снова</button>
        </div>
    </section>

    <section id="auth" class="hidden">
        <div style="background: var(--gray); padding: 25px; border-radius: 15px;">
            <h2>Вход</h2>
            <input type="text" id="username" placeholder="Ник в Discord">
            <button onclick="login()">ВОЙТИ</button>
        </div>
    </section>

    <section id="voting" class="hidden">
        <div style="display:flex; justify-content: space-between; margin-bottom: 20px; align-items: center;">
            <span id="user-display" style="color: var(--accent); font-weight: bold;"></span>
            <button onclick="logout()" style="width:auto; background:#444; padding: 5px 10px; font-size: 0.8rem;">Выход</button>
        </div>
        <div id="nomination-list">Загрузка данных...</div>
    </section>

<script>
    const SB_URL = 'https://fvutldjdfohsicciiqav.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ2dXRsZGpkZm9oc2ljY2lpcWF2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA2MDY0NTYsImV4cCI6MjA4NjE4MjQ1Nn0.9OoAdbtpjIqLUJJkvbyUEnFCMj1qHrvhvjV43lZn2nk';
    
    let supabase;
    const nominationsData = {
        "Лучший тиммейт": ["Fiven", "3DAROVO", "Иван Горин", "lyskofelo", "admin_v_kedah666", "sleepysloppy"],
        "Легенда сервера": ["Fiven", "3DAROVO", "Иван Горин", "lyskofelo", "admin_v_kedah666"],
        "Игрок CS": ["Fiven", "rudy", "3DAROVO", "сыкло", "Иван Горин", "Zeus"],
        "Игрок DOTA2": ["Иван Горин", "lyskofelo", "admin_v_kedah666", "Horohi", "сыкло", "Aniraqq"],
        "Травитель баек": ["Иван Горин", "lyskofelo", "admin_v_kedah666", "сыкло", "snaker mai"],
        "Комфортик": ["Иван Горин", "lyskofelo", "admin_v_kedah666", "сыкло", "snaker mai", "sleepysloppy", "Fiven", "3DAROVO", "Zeus"]
    };

    function initApp() {
        // Проверяем наличие библиотеки Supabase
        if (typeof supabase === 'undefined' && !window.supabase) {
            document.getElementById('lib-error').classList.remove('hidden');
            document.getElementById('main-btn').classList.add('hidden');
            return;
        }

        if (!supabase) {
            supabase = window.supabase.createClient(SB_URL, SB_KEY);
        }
        
        const savedUser = localStorage.getItem('kenti_user');
        if (savedUser) {
            showPage('voting');
        } else {
            showPage('auth');
        }
    }

    function showPage(id) {
        document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
        if(id === 'voting') render();
    }

    function login() {
        const val = document.getElementById('username').value.trim();
        if(val.length < 2) return alert("Введите ник (мин. 2 символа)");
        localStorage.setItem('kenti_user', val);
        showPage('voting');
    }

    async function render() {
        const currentUser = localStorage.getItem('kenti_user');
        document.getElementById('user-display').innerText = `Ник: ${currentUser}`;
        const list = document.getElementById('nomination-list');
        
        try {
            const { data: allVotes, error } = await supabase.from('votes').select('*');
            if(error) throw error;

            list.innerHTML = '';
            for (let cat in nominationsData) {
                const vCat = allVotes.filter(v => v.nomination === cat);
                const mine = vCat.find(v => v.username === currentUser);
                
                const counts = {};
                vCat.forEach(v => counts[v.nominee] = (counts[v.nominee] || 0) + 1);
                let top = Object.keys(counts).reduce((a, b) => counts[a] > counts[b] ? a : b, null);

                const div = document.createElement('div');
                div.className = 'nomination';
                div.innerHTML = `<h3>${cat}</h3>${top ? `<span class="winner-tag">🏆 Лидер: ${top} (${counts[top]})</span>` : ''}`;
                
                nominationsData[cat].forEach(n => {
                    const c = counts || 0;
                    div.innerHTML += `
                        <div class="nominee-item">
                            <span>${n} (${c})</span>
                            <button class="vote-btn" onclick="vote('${cat}','${n}')" ${mine ? 'disabled' : ''}>
                                ${mine?.nominee === n ? 'Твой выбор' : (mine ? '—' : 'Голос')}
                            </button>
                        </div>`;
                });
                list.appendChild(div);
            }
        } catch (e) {
            list.innerHTML = `<div class="error-card">Ошибка подключения к базе. Проверь интернет или настройки Supabase.</div>`;
            console.error(e);
        }
    }

    async function vote(c, n) {
        const currentUser = localStorage.getItem('kenti_user');
        const { error } = await supabase.from('votes').insert([{ username: currentUser, nomination: c, nominee: n }]);
        if (error) alert("Ошибка при голосовании!");
        render();
    }

    function logout() {
        localStorage.removeItem('kenti_user');
        location.reload();
    }

    // Авто-логин при загрузке страницы, если библиотека доступна
    window.onload = () => {
        if (localStorage.getItem('kenti_user')) {
            setTimeout(initApp, 800);
        }
    };
</script>
</body>
</html>
